[project]
name = "kaden"
version = "0.1.0"
description = "A modular AI agent application: a runtime and four swappable modules (Core, Memory, Tools, Frontend)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "K5031"}]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "ddgs>=9.16.1",
    "httpx2>=2.12",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "openai>=3.41.0",
    "openpyxl>=3.1.5",
    "pathspec>=0.12",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "segno>=1.6.6",
    "tomli-w>=1.2.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
kaden = "kaden.__main__:main"
kd = "kaden.__main__:main"  # the same, shorter
kaden-desktop = "kaden.window:main"  # the desktop app (needs the desktop extra)

# Installed modules, listed in every frontend's settings. A user-made module registers the
# same way in its own package (docs/development.md).
[project.entry-points."kaden.cores"]
anthropic = "kaden.core.anthropic:factory"
deepseek = "kaden.core.openai_compat:deepseek_factory"
openai = "kaden.core.openai_compat:openai_factory"

[project.entry-points."kaden.memories"]
sqlite = "kaden.memory.sqlite:factory"
files = "kaden.memory.files:factory"

[project.entry-points."kaden.tools"]
shell-files = "kaden.tools.shell_files:factory"

[project.entry-points."kaden.frontends"]
desktop = "kaden.frontends.desktop:factory"

[project.optional-dependencies]
desktop = [
    "numpy>=2.5.4",
    "pygments>=2.21",
    "pyside6-addons>=6.12.0",
    "pyside6-essentials>=6.12.0",
    "qasync>=0.28.0",
    "sherpa-onnx>=1.13,<2",
    "sherpa-onnx-core>=1.13,<2",  # the libraries; uv does not see sherpa-onnx requires it
]
# The natural voice on an NVIDIA GPU (docs/using-kaden.md). Chatterbox allows a PyTorch
# new enough for RTX 50 GPUs on Python 3.14 only.
voice-gpu = [
    "kaden[desktop]",
    "chatterbox-tts>=0.1.7; python_version >= '3.14'",
    "setuptools<81; python_version >= '3.14'",  # its watermarker imports pkg_resources
]

[dependency-groups]
dev = [
    "kaden[desktop]",
    "psutil>=7.2.2",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-n auto"  # parallel (pytest-xdist); -n 0 runs in one process

[tool.ruff]
line-length = 100

# Desktop bundles (`briefcase build`); see docs/development.md.
[tool.briefcase]
project_name = "Kaden"
bundle = "io.github.k5031"
version = "0.1.0"
url = "https://github.com/K5031/Kaden"
author = "K5031"

[tool.briefcase.app.kaden-desktop]
formal_name = "Kaden"
description = "An AI agent that works for you on your computer."
long_description = """An AI agent for your computer, in a desktop app. It runs commands, works
with files and searches the web, decides on its own only what is safe and asks you about the
rest, and stops at hard spending limits. Works with Anthropic, DeepSeek and
OpenAI-compatible models."""
sources = ["src/kaden_desktop"]
# Kaden itself, installed with its metadata: its modules are found through entry points.
# Written as a path ("/"), so a build in Docker makes a wheel of it to install there.
requires = ["./[desktop]"]

[tool.briefcase.app.kaden-desktop.linux.flatpak]
finish_arg."talk-name=org.freedesktop.secrets" = true

# What the system packages need of the system: Qt's own requirements for its window and
# audio (doc.qt.io/qt-6/linux-requirements.html), from the distribution's packages.
[tool.briefcase.app.kaden-desktop.linux.system.debian]
system_runtime_requires = [
    "libdbus-1-3", "libegl1", "libfontconfig1", "libgl1", "libice6", "libpulse0", "libsm6",
    "libx11-xcb1", "libxcb-cursor0", "libxcb-icccm4", "libxcb-image0", "libxcb-keysyms1",
    "libxcb-randr0", "libxcb-render-util0", "libxcb-shape0", "libxcb-xinerama0",
    "libxcb-xkb1", "libxext6", "libxkbcommon-x11-0", "libxrender1",
]

[tool.briefcase.app.kaden-desktop.linux.system.rhel]
system_runtime_requires = ["qt6-qtbase-gui", "qt6-qtmultimedia", "pulseaudio-libs"]

[tool.briefcase.app.kaden-desktop.linux.system.arch]
system_runtime_requires = ["qt6-base", "qt6-multimedia", "libpulse"]
