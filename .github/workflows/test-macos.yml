# Runs the tests on macOS, the one place the macOS code runs for real: the Seatbelt
# sandbox profile (tests/test_sandbox.py, the boundary test in test_tools_shell_files.py),
# the file tools without /proc, and screencapture being found.
name: Tests (macOS)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Install
        run: uv sync --python 3.14
      - name: Lint
        run: uv run ruff check
      # The window's start hangs here on a worker thread (a voice name read that never
      # returns): every thread's stack is printed after 4 s, before the test gives up at 5.
      - name: Diagnose the window start
        continue-on-error: true
        run: >-
          uv run pytest -n0 -o faulthandler_timeout=4 -s
          tests/test_desktop_window.py -k written_once_when_the_window_closes
      - name: Test
        run: uv run pytest
